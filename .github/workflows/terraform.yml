name: Terraform CI-CD

on:

  # Run automatically when code is pushed
  # to feature branches
  push:
    branches:
      - "feature/**"
      - main

  # Run validation again when PR is created/updated
  # against main
  pull_request:
    branches:
      - main


# ============================================================
# GLOBAL PERMISSIONS
# ============================================================

permissions:
  contents: read
  pull-requests: write


# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:
  TF_VERSION: "1.9.8"
  TF_WORKING_DIR: "./environment"


jobs:

  # ============================================================
  # FEATURE BRANCH
  # TERRAFORM VALIDATE
  # ============================================================

  feature-validate:

    name: Feature - Terraform Validate

    if: |
      startsWith(github.ref, 'refs/heads/feature/')
      || (
        github.event_name == 'pull_request'
        && startsWith(github.head_ref, 'feature/')
      )

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Version
        run: terraform version

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


  # ============================================================
  # FEATURE BRANCH
  # TERRAFORM PLAN
  # ============================================================

  feature-plan:

    name: Feature - Terraform Plan

    needs: feature-validate

    if: |
      startsWith(github.ref, 'refs/heads/feature/')
      || (
        github.event_name == 'pull_request'
        && startsWith(github.head_ref, 'feature/')
      )

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false


  # ============================================================
  # FEATURE BRANCH
  # CREATE PULL REQUEST AUTOMATICALLY
  #
  # This runs ONLY after successful feature plan
  # and ONLY on direct push to feature branch.
  # ============================================================

  create-pr:

    name: Create Pull Request

    needs: feature-plan

    if: |
      startsWith(github.ref, 'refs/heads/feature/')
      && github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}

        run: |

          echo "Feature Branch: $BRANCH_NAME"

          # Check if PR already exists
          EXISTING_PR=$(gh pr list \
            --base main \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING_PR" -gt 0 ]; then

            echo "Pull Request already exists."
            echo "Skipping PR creation."

          else

            echo "Creating Pull Request..."

            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "Terraform changes - $BRANCH_NAME" \
              --body "Automatically created after successful Terraform Validate and Plan."

            echo "Pull Request created successfully."

          fi


  # ============================================================
  # MAIN BRANCH
  # TERRAFORM VALIDATE
  # ============================================================

  main-validate:

    name: Main - Terraform Validate

    if: |
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Version
        run: terraform version

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


  # ============================================================
  # MAIN BRANCH
  # TERRAFORM PLAN
  # ============================================================

  main-plan:

    name: Main - Terraform Plan

    needs: main-validate

    if: |
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan


  # ============================================================
  # MAIN BRANCH
  # TERRAFORM APPLY
  # ============================================================

  main-apply:

    name: Main - Terraform Apply

    needs: main-plan

    if: |
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # GitHub Environment
    # You can configure approval for this environment
    # from:
    # Settings -> Environments -> production

    environment:
      name: production

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan